<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云梭数智工业互联网平台【智能仓储】V3.69</title>
<link rel="stylesheet" href="css/wms.css">
</head>
<body>
<div id="app">
  <!-- 顶部标题栏 -->
  <div id="titleBar">
    <div class="title-brand">
      <div class="brand-mark">W</div>
      <div class="title-texts">
        <div class="sys-title">云梭数智工业互联网平台【智能仓储】<span class="ver">V3.69</span></div>
        <div class="sys-subtitle">YunSuo Industrial Internet Platform [Warehouse Management System]</div>
      </div>
    </div>
    <div class="title-right">
      <span class="op-info">操作员: <b>管理员</b></span>
      <span class="op-info">主题: 经典样式</span>
      <span class="title-links">
        <a href="javascript:;">修改密码</a>
        <a href="javascript:;">注销</a>
        <a href="javascript:;" onclick="exitSystem()">退出系统</a>
      </span>
      <div class="logo">YUNSUO<i>数智</i></div>
    </div>
  </div>

  <!-- 主区域 -->
  <div id="mainArea">
    <div id="sidebar">
      <div class="sidebar-title">功能菜单</div>
      <div id="menuTree"></div>
    </div>
    <div id="contentArea">
      <div id="tabBar"></div>
      <div id="pageContainer"></div>
    </div>
  </div>

  <!-- 底部状态栏 -->
  <div id="statusBar">
    <span class="st">使用单位: 浙江云梭纺织股份有限公司</span>
    <span class="st">技术支持: 云梭集团信息中心</span>
    <span class="st">登录用户: admin 管理员</span>
    <span class="st" id="loginTime"></span>
    <span class="st st-right" id="serverTime"></span>
  </div>
</div>
<div id="dialogLayer"></div>
<script src="js/data.js"></script>
<script src="js/schema.js"></script>
<script src="js/modules.js"></script>
<script src="js/app.js"></script>
</body>
</html>
